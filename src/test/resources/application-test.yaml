spring:
  kafka:
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000

  datasource:
    hikari:
      data-source-properties:
        tinyInt1isBit: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  internal:
    service-token: "test-internal-token"

  audit:
    hash-key-base64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  
  outbox:
    encryption-key-base64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

  kyc-expiry:
    enabled: false
    batch-size: 50
    fixed-delay-ms: 60000

  kyc-submission:
    expiry-days: 30

  notification-links:
    public-base-url: "https://taca.vn"
    email-verification-path: "/verify"
    password-reset-path: "/reset-password"

  email-verification:
    ttl-minutes: 30

  otp:
    hash-key-base64: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

  mfa:
    encryption-key-base64: "FjCTJSr7RYZufOFSFng8eSQkKURuio1qVtOtKAe7tvc="

  jwt:
    key-id: "test-rsa-key"
    private-key-base64: ""
    public-key-base64: ""

  outbox-publisher:
    enabled: false
    batch-size: 50
    fixed-delay-ms: 2000
    max-retries: 3
    retry-backoff-seconds: 2
    send-timeout-ms: 35000

    max-pending-events: 1000
    max-oldest-pending-age-seconds: 300
    max-failed-events: 0

  outbox-cleanup:
    enabled: false
    fixed-delay-ms: 3600000
    published-retention-days: 7
    failed-retention-days: 30
    batch-size: 500

  kafka:
    topic-guard:
      enabled: false
      timeout-seconds: 10

    topics:
      notification-commands: notification.commands.v1
      user-events: user.events.v1
      shop-events: shop.events.v1
      dlq: auth-user.events.dlq.v1

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
